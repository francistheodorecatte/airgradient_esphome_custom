esp32:
  cpu_frequency: 80MHz
  framework:
    advanced:
      compiler_optimization: PERF
      assertion_level: DISABLE
      enable_lwip_assert: false
      enable_lwip_mdns_queries: false

# enable power management clock scaler
power_management:
  - platform: esp32_power_management
    enable_light_sleep: false
    min_frequency: 2MHz
    max_frequency: 80MHz

uart:
  - id: !extend senseair_co2_uart
    clock_source: XTAL
  - id: !extend pms5003_uart
    clock_source: XTAL
